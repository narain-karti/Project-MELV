# =============================================================================
# Project-MELV :: Eclipse Mosquitto Edge MQTT Broker Configuration
# SIH Problem Statement 26127: Low-Bandwidth Edge-to-Central Telemetry Mesh
# =============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# WebSockets listener for real-time browser HUD streaming
listener 9001 0.0.0.0
protocol websockets

# Persistence & Logging
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Max packet size: 64KB (ANPR edge telemetry payloads are ~220 bytes)
max_packet_size 65536
max_queued_messages 10000
